<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="pageGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Modern Dark Squircle Base -->
  <rect width="64" height="64" rx="16" fill="#030712"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="#070b18" stroke="url(#bookCover)" stroke-width="1.8" stroke-opacity="0.8"/>
  
  <!-- Left Page -->
  <path d="M32 46C25.5 42.5 17.5 42.5 11 44.5V18C17.5 16 25.5 16 32 19.5V46Z" fill="url(#pageGlow)" filter="url(#glow)"/>
  <path d="M32 46C25.5 42.5 17.5 42.5 11 44.5V18C17.5 16 25.5 16 32 19.5V46Z" stroke="#0891b2" stroke-width="1.2" fill="none"/>
  
  <!-- Right Page -->
  <path d="M32 46C38.5 42.5 46.5 42.5 53 44.5V18C46.5 16 38.5 16 32 19.5V46Z" fill="url(#pageGlow)" filter="url(#glow)"/>
  <path d="M32 46C38.5 42.5 46.5 42.5 53 44.5V18C46.5 16 38.5 16 32 19.5V46Z" stroke="#0891b2" stroke-width="1.2" fill="none"/>
  
  <!-- Center Book Spine Glowing Line -->
  <path d="M32 18.5V47" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Futuristic Knowledge Content Lines on Left Page -->
  <line x1="16" y1="24" x2="26" y2="24" stroke="#0284c7" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="16" y1="29.5" x2="27" y2="29.5" stroke="#0284c7" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="16" y1="35" x2="23" y2="35" stroke="#0284c7" stroke-width="1.6" stroke-linecap="round"/>
  
  <!-- Futuristic Knowledge Content Lines on Right Page -->
  <line x1="38" y1="24" x2="48" y2="24" stroke="#0284c7" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="37" y1="29.5" x2="48" y2="29.5" stroke="#0284c7" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="41" y1="35" x2="48" y2="35" stroke="#0284c7" stroke-width="1.6" stroke-linecap="round"/>
  
  <!-- Top Hologram Diamond / Spark -->
  <circle cx="32" cy="13.5" r="2.2" fill="#38bdf8" filter="url(#glow)"/>
</svg>
